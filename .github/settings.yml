# Repository settings managed through Probot Settings.
# Source of truth for the intended protection policy of the default branch.
# Applying this file requires the repository to run/configure the corresponding
# Probot Settings workflow/app; the file itself does not activate protection.

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - Validate engineering evidence
          - Validate governance controls
          - Validate repository quality
          - Validate security controls
      enforce_admins: true
      required_linear_history: false
      restrictions: null
