name: Evidence Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR a validar
        required: false
        type: string
  repository_dispatch:
    types: [validation-requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  evidence-validation:
    name: Validate engineering evidence
    runs-on: ubuntu-latest
    steps:
      - name: Resolve validation target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number || github.event.client_payload.pr_number || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$EVENT_PR_NUMBER" ]]; then
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$EVENT_PR_NUMBER")"
            echo "TARGET_PR_NUMBER=$EVENT_PR_NUMBER" >> "$GITHUB_ENV"
            echo "TARGET_PR_SHA=$(printf '%s' "$pr_json" | jq -r '.head.sha')" >> "$GITHUB_ENV"
          else
            echo "TARGET_PR_NUMBER=" >> "$GITHUB_ENV"
            echo "TARGET_PR_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.TARGET_PR_SHA }}

      - name: EV-001 - Validate minimum PR evidence structure
        if: env.TARGET_PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ env.TARGET_PR_NUMBER }}
        run: |
          set -euo pipefail
          PR_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')"
          for section in '## Objetivo' '## Cambios' '## Análisis de impacto' '## Evidencia esperada' '## Relación'; do
            printf '%s\n' "$PR_BODY" | grep -Fq "$section" || { echo "FAIL EV-001: falta la sección requerida: $section"; exit 1; }
          done
          echo "PASS EV-001: estructura mínima de evidencia presente en el PR."

      - name: EV-002 - Validate Issue to PR traceability
        if: env.TARGET_PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ env.TARGET_PR_NUMBER }}
        run: |
          set -euo pipefail
          PR_DATA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_BODY="$(printf '%s' "$PR_DATA" | jq -r '.body // ""')"
          PR_TITLE="$(printf '%s' "$PR_DATA" | jq -r '.title // ""')"
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eq '#[0-9]+' || { echo "FAIL EV-002: no se encontró referencia a un Issue."; exit 1; }
          printf '%s\n' "$PR_BODY" | grep -Eq 'Closes #[0-9]+|Fixes #[0-9]+|Resolves #[0-9]+' || { echo "FAIL EV-002: no se encontró una relación explícita de cierre con Issue."; exit 1; }
          echo "PASS EV-002: relación Issue–PR declarada."

      - name: EV-003 - Validate evaluated commit identity
        env:
          EXPECTED_SHA: ${{ env.TARGET_PR_SHA }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_SHA" || { echo "FAIL EV-003: HEAD ($actual_sha) no coincide con el commit evaluado ($EXPECTED_SHA)."; exit 1; }
          echo "PASS EV-003: commit evaluado identificado de forma determinista: $actual_sha"

      - name: EV-004 - Validate declared validation metadata
        if: env.TARGET_PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ env.TARGET_PR_NUMBER }}
        run: |
          set -euo pipefail
          PR_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')"
          metadata=$(awk '/^```yaml[[:space:]]*$/{capture=1;next} capture && /^```[[:space:]]*$/{exit} capture{print}' <<< "$PR_BODY")
          if [[ -z "$metadata" ]]; then echo "FAIL EV-004: falta el bloque YAML de metadata de gobernanza."; exit 1; fi
          METADATA="$metadata" ruby -ryaml -e '
            data = YAML.safe_load(ENV.fetch("METADATA"), permitted_classes: [], aliases: false) || {}
            governance = data["governance"]
            abort "FAIL EV-004: governance metadata must be a mapping." unless governance.is_a?(Hash)
            abort "FAIL EV-004: unsupported schema_version." unless governance["schema_version"] == "1"
            validation = governance["validation"]
            abort "FAIL EV-004: governance.validation must be a mapping." unless validation.is_a?(Hash)
            required = %w[evidence governance quality security]
            missing = required.reject { |key| validation[key] == "required" }
            abort "FAIL EV-004: missing required validation declarations: #{missing.join(", ")}" unless missing.empty?
            unexpected = validation.keys - required
            abort "FAIL EV-004: unsupported validation keys: #{unexpected.join(", ")}" unless unexpected.empty?
            puts "PASS EV-004: structured validation metadata declares all required controls."
          '

      - name: EV-005 - Validate evidence baseline artifacts
        run: |
          set -euo pipefail
          required=(
            docs/Governance/03-Artifacts-And-Evidence.md
            docs/Governance/10-Governance-Enforcement-Architecture.md
            docs/Governance/14-Evidence-Validation-Architecture.md
            docs/Governance/21-Engineering-Metrics-Governance.md
            docs/Governance/22-Engineering-Metrics-Control-Matrix.md
            docs/Governance/Metrics/Metric-Catalog.yml
            docs/Governance/Metrics/Engineering-Governance-Dashboard.md
            docs/Governance/Metrics/Engineering-Governance-Dashboard.html
            .github/workflows/governance-validation.yml
            .github/workflows/quality-validation.yml
            .github/workflows/security-validation.yml
            .github/workflows/evidence-validation.yml
          )
          for file in "${required[@]}"; do test -s "$file" || { echo "FAIL EV-005: artefacto de evidencia ausente o vacío: $file"; exit 1; }; done
          echo "PASS EV-005: baseline de evidencia presente."

      - name: Evidence Validation result
        run: |
          echo "EVIDENCE_VALIDATION=PASS"
          echo "Los controles EV-001..EV-005 aplicables al estado actual fueron satisfechos."
          echo "EV-006 queda planificado para correlacionar automáticamente resultados de workflows previos."
          echo "Este resultado no constituye certificación de suficiencia de evidencia ni de calidad, seguridad o corrección del producto."
