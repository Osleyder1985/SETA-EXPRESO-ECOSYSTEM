name: Governance Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-validation:
    name: Validate governance controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Validate Pull Request governance metadata
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [ "$PR_HEAD_REF" = "main" ]; then
            echo "ERROR: La branch de origen del Pull Request no puede ser main."
            exit 1
          fi

          if ! printf '%s\n' "$PR_TITLE" | grep -Eq '^.+/.+: .+\.$'; then
            echo "ERROR: El título del Pull Request debe cumplir: Módulo/Archivo: Acción a realizar."
            exit 1
          fi

          if [[ "$PR_BODY" != *"Issue #"* && "$PR_BODY" != *"Closes #"* && "$PR_BODY" != *"Fixes #"* && "$PR_BODY" != *"Resolves #"* ]]; then
            echo "ERROR: El Pull Request no contiene una referencia válida a un Issue."
            exit 1
          fi

          if [[ "$PR_BODY" != *"Análisis de impacto"* ]]; then
            echo "ERROR: El Pull Request no contiene el elemento de gobernanza requerido: Análisis de impacto"
            exit 1
          fi

          label_count=$(jq '.pull_request.labels | length' "$GITHUB_EVENT_PATH")
          if [ "$label_count" -lt 1 ]; then
            echo "ERROR: El Pull Request debe tener al menos un label pertinente."
            exit 1
          fi

          ready_count=$(printf '%s\n' "$PR_BODY" | grep -Ec '^🟢 \*\*LISTO PARA FUSIÓN\.\*\*$' || true)
          pending_count=$(printf '%s\n' "$PR_BODY" | grep -Ec '^🟡 \*\*NO FUSIONAR — TRABAJO PENDIENTE\.\*\*$' || true)

          if [ $((ready_count + pending_count)) -ne 1 ]; then
            echo "ERROR: El Pull Request debe declarar exactamente un estado de integración: LISTO PARA FUSIÓN o NO FUSIONAR — TRABAJO PENDIENTE."
            exit 1
          fi

          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "origin/main" HEAD; then
            echo "ERROR: La branch del Pull Request no contiene la línea base actual de main. Rebase o actualiza la branch antes de integrar."
            exit 1
          fi

          echo "OK: Metadatos, título, labels y línea base del Pull Request conformes."

      - name: Repository governance baseline
        run: |
          set -euo pipefail
          test -f Docs/Governance/00-Software-Lifecycle-Master.md
          test -f Docs/Governance/03-Artifacts-And-Evidence.md
          test -f Docs/Governance/04-Quality-Gates.md
          test -f Docs/Governance/05-Repository-Naming-Convention.md
          test -f Docs/Governance/06-Change-Control-Workflow.md
          test -f Docs/Governance/07-Main-Protection-Strategy.md
          test -f Docs/Governance/08-Software-Roadmap.md
          test -f Docs/Governance/09-Issue-And-Pull-Request-Labeling-Policy.md
          test -f Docs/Governance/10-Governance-Enforcement-Architecture.md
          test -f .github/workflows/governance-validation.yml
          echo "OK: La línea base documental y automatizada de gobernanza está presente."

      - name: Detect update to main
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PUSHER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Se detectó una actualización de main."
          echo "Commit: $COMMIT_SHA"
          echo "Actor: $PUSHER"
          echo "Mensaje: $COMMIT_MESSAGE"

          pr_count=$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$REPOSITORY/commits/$COMMIT_SHA/pulls" \
            | jq 'length')

          if [ "$pr_count" -eq 0 ]; then
            echo "SUSPICIOUS_DIRECT_UPDATE: no se encontró un Pull Request asociado al commit que actualizó main."
            echo "Este control es detectivo y requiere análisis del evento; no puede impedir ni revertir por sí mismo el cambio."
            exit 1
          fi

          echo "OK: La actualización de main tiene al menos un Pull Request asociado."
          echo "Este control confirma trazabilidad detectiva; no sustituye branch protection nativa."
