name: Governance Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR a validar
        required: false
        type: string
  repository_dispatch:
    types: [validation-requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-validation:
    name: Validate governance controls
    runs-on: ubuntu-latest
    steps:
      - name: Resolve validation target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number || github.event.client_payload.pr_number || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$EVENT_PR_NUMBER" ]]; then
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$EVENT_PR_NUMBER")"
            target_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
            echo "TARGET_PR_NUMBER=$EVENT_PR_NUMBER" >> "$GITHUB_ENV"
            echo "TARGET_PR_SHA=$target_sha" >> "$GITHUB_ENV"
            echo "TARGET_PR_REF=$(printf '%s' "$pr_json" | jq -r '.head.ref')" >> "$GITHUB_ENV"
          else
            echo "TARGET_PR_NUMBER=" >> "$GITHUB_ENV"
            echo "TARGET_PR_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
            echo "TARGET_PR_REF=" >> "$GITHUB_ENV"
          fi
          echo "EVENT_NAME=$GITHUB_EVENT_NAME" >> "$GITHUB_ENV"
          echo "EVENT_ACTOR=$GITHUB_ACTOR" >> "$GITHUB_ENV"
          echo "DISPATCH_PR_NUMBER=$EVENT_PR_NUMBER" >> "$GITHUB_ENV"
          if [[ -n "$EVENT_PR_NUMBER" ]]; then echo "DISPATCH_SHA=$target_sha" >> "$GITHUB_ENV"; else echo "DISPATCH_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"; fi

      - name: Record execution context
        run: |
          set -euo pipefail
          jq -n --arg event "$EVENT_NAME" --arg actor "$EVENT_ACTOR" --arg pr "$DISPATCH_PR_NUMBER" --arg sha "$DISPATCH_SHA" --arg repository "$GITHUB_REPOSITORY" --arg run_id "$GITHUB_RUN_ID" '{repository:$repository,event_name:$event,actor:$actor,target_pr_number:(if $pr == "" then null else ($pr|tonumber) end),target_sha:$sha,workflow_run_id:$run_id}' > governance-dispatch-context.json
          cat governance-dispatch-context.json

      - name: Upload execution context evidence
        uses: actions/upload-artifact@v4
        with:
          name: governance-dispatch-context-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: governance-dispatch-context.json
          if-no-files-found: error
          retention-days: 90

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_PR_SHA }}

      - name: Validate Pull Request governance metadata
        if: env.TARGET_PR_NUMBER != ''
        env:
          PR_HEAD_REF: ${{ env.TARGET_PR_REF }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ env.TARGET_PR_NUMBER }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_JSON="$(curl --fail-with-body --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER")"
          PR_BODY="$(printf '%s' "$PR_JSON" | jq -r '.body // ""')"
          PR_TITLE="$(printf '%s' "$PR_JSON" | jq -r '.title // ""')"
          LABEL_COUNT="$(printf '%s' "$PR_JSON" | jq '.labels | length')"

          echo "HEAD_REF=[$PR_HEAD_REF]"
          echo "PR_TITLE=[$PR_TITLE]"
          echo "LABEL_COUNT=[$LABEL_COUNT]"

          if [ "$PR_HEAD_REF" = "main" ]; then
            echo "FAIL: PR head cannot be main."; exit 1
          fi
          if ! printf '%s\n' "$PR_HEAD_REF" | grep -Eq '^issue-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "FAIL: invalid issue branch naming."; exit 1
          fi

          issue_number=$(printf '%s\n' "$PR_HEAD_REF" | sed -E 's/^issue-([0-9]+)-.*/\1/')
          echo "ISSUE_NUMBER=[$issue_number]"

          if [[ "$PR_BODY" != *"#$issue_number"* ]]; then
            echo "FAIL: PR body does not reference issue #$issue_number."; exit 1
          fi
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq '^.+\([^()]+\): .+\.$'; then
            echo "FAIL: PR title does not conform."; exit 1
          fi
          if [[ "$PR_BODY" != *"Issue #"* && "$PR_BODY" != *"Closes #"* && "$PR_BODY" != *"Fixes #"* && "$PR_BODY" != *"Resolves #"* ]]; then
            echo "FAIL: explicit issue relation missing."; exit 1
          fi
          if [[ "$PR_BODY" != *"Análisis de impacto"* ]]; then
            echo "FAIL: impact analysis section missing."; exit 1
          fi
          if [ "$LABEL_COUNT" -lt 1 ]; then
            echo "FAIL: PR requires at least one label."; exit 1
          fi

          ready_count=$(printf '%s\n' "$PR_BODY" | grep -Ec '^[[:space:]]*🟢[[:space:]]+\*\*LISTO PARA FUSIÓN\.\*\*[[:space:]]*$' || true)
          pending_count=$(printf '%s\n' "$PR_BODY" | grep -Ec '^[[:space:]]*🟡[[:space:]]+\*\*NO FUSIONAR — TRABAJO PENDIENTE\.\*\*[[:space:]]*$' || true)
          echo "READY_COUNT=[$ready_count] PENDING_COUNT=[$pending_count]"
          if [ $((ready_count + pending_count)) -ne 1 ]; then
            echo "FAIL: integration status must contain exactly one recognized formal state."; exit 1
          fi
          echo "OK: Governance metadata conforms."

      - name: Repository governance baseline
        run: |
          set -euo pipefail
          required=(
            docs/Governance/00-Software-Lifecycle-Master.md
            docs/Governance/03-Artifacts-And-Evidence.md
            docs/Governance/04-Quality-Gates.md
            docs/Governance/05-Repository-Naming-Convention.md
            docs/Governance/06-Change-Control-Workflow.md
            docs/Governance/07-Main-Protection-Strategy.md
            docs/Governance/08-Software-Roadmap.md
            docs/Governance/09-Issue-And-Pull-Request-Labeling-Policy.md
            docs/Governance/10-Governance-Enforcement-Architecture.md
            docs/Governance/11-Governance-Control-Matrix.md
            docs/Governance/12-Quality-Validation-Architecture.md
            docs/Governance/13-Security-Validation-Architecture.md
            docs/Governance/14-Evidence-Validation-Architecture.md
            docs/Governance/17-Risk-Management-System.md
            docs/Governance/18-Risk-Management-Control-Matrix.md
            docs/Governance/19-Decision-Governance.md
            docs/Governance/20-Decision-Governance-Control-Matrix.md
            docs/Governance/21-Engineering-Metrics-Governance.md
            docs/Governance/22-Engineering-Metrics-Control-Matrix.md
            docs/Governance/23-AI-Governance.md
            docs/Governance/24-AI-Governance-Control-Matrix.md
            docs/Governance/25-Data-Governance.md
            docs/Governance/26-Data-Governance-Control-Matrix.md
            docs/Governance/35-Configuration-Management.md
            docs/Governance/41-Configuration-Management-Control-Matrix.md
            docs/Governance/48-Decision-Authority-Governance.md
            docs/Governance/Decision/README.md
            docs/Governance/Decision/Role-Register.yml
            docs/Governance/Decision/Decision-Authority-Matrix.yml
            docs/Governance/Decision/Decision-Authority-Register.md
            docs/Governance/Decision/Decision-Authority-Control-Matrix.md
            docs/Governance/Decision/Decision-Authority-Impact-Analysis.md
            docs/Governance/Decision/Decision-Authority-Escalation.md
            docs/Governance/Decision/Role-Assignment-Policy.md
            docs/Governance/Configuration/README.md
            docs/Governance/Configuration/Configuration-Item-Register.yml
            docs/Governance/Configuration/Configuration-Baseline-Register.yml
            docs/Governance/Configuration/Configuration-Status-Accounting.md
            docs/Governance/Configuration/Configuration-Audit-Checklist.md
            docs/Governance/Configuration/Configuration-Impact-Analysis.md
            .github/workflows/governance-validation.yml
            .github/workflows/quality-validation.yml
            .github/workflows/security-validation.yml
            .github/workflows/evidence-validation.yml
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "FAIL: baseline artifact missing or empty: $file"; exit 1; }
          done
          echo "OK: Governance baseline present."

      - name: Detect update to main
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PUSHER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Commit: $COMMIT_SHA"
          echo "Actor: $PUSHER"
          echo "Mensaje: $COMMIT_MESSAGE"
          pr_count=$(curl --fail-with-body --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/$REPOSITORY/commits/$COMMIT_SHA/pulls" | jq 'length')
          if [ "$pr_count" -eq 0 ]; then
            echo "SUSPICIOUS_DIRECT_UPDATE: no se encontró un Pull Request asociado al commit que actualizó main."
            exit 1
          fi
          echo "OK: main update has Pull Request traceability."
