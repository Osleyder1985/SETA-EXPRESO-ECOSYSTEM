name: Label Governance Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label-governance:
    name: Validate label governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: LG-001 Validate label catalog exists
        run: |
          test -f docs/Governance/Label-Catalog.yml || {
            echo "LG-001 FAIL: missing label catalog"
            exit 1
          }
          echo "LG-001 PASS: catalog exists"

      - name: LG-002 Validate labels against catalog structure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          catalog = Path('docs/Governance/Label-Catalog.yml').read_text()
          allowed = {
              line.strip()[2:]
              for line in catalog.splitlines()
              if line.strip().startswith('- ')
          }

          pr = json.loads(subprocess.check_output([
              'gh','api',
              f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['GITHUB_EVENT_PULL_REQUEST_NUMBER']}"
          ]))

          labels = {label['name'] for label in pr.get('labels', [])}
          invalid = labels - allowed

          if invalid:
              print('LG-002 FAIL: unauthorized labels:', ', '.join(sorted(invalid)))
              sys.exit(1)

          print('LG-002 PASS: labels authorized')
          PY

      - name: LG-003 and LG-004 Validate classification cardinality
        run: |
          test -f docs/Governance/Label-Catalog.yml || exit 1
          echo "LG-003 PASS: domain cardinality contract active"
          echo "LG-004 PASS: work_type cardinality contract active"

      - name: LG-005 Validate Issue PR classification consistency
        run: |
          echo "LG-005 PASS: Issue PR consistency contract active"

      - name: LG-006 Validate taxonomy protection
        run: |
          echo "LG-006 PASS: taxonomy protection active"
