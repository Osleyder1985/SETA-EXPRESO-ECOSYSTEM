name: Label Governance Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  label-governance:
    name: Validate label governance LG-001-LG-006
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: LG-001 Validate catalog schema
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/Governance/Label-Catalog.yml
          ruby -ryaml -e '
            c = YAML.safe_load(File.read("docs/Governance/Label-Catalog.yml"), permitted_classes: [], aliases: false) || {}
            abort "LG-001 FAIL: schema_version must be 1" unless c["schema_version"] == "1"
            labels = c["labels"]
            abort "LG-001 FAIL: labels section missing" unless labels.is_a?(Hash)
            %w[domain work_type].each { |k| abort "LG-001 FAIL: #{k} catalog missing" unless labels[k].is_a?(Hash) }
            puts "LG-001 PASS: catalog exists and has required dimensions"
          '

      - name: LG-002 to LG-004 Validate PR labels and cardinality
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            c = YAML.safe_load(File.read("docs/Governance/Label-Catalog.yml"), permitted_classes: [], aliases: false) || {}
            File.write("/tmp/catalog-labels", c.fetch("labels").values.flat_map(&:keys).uniq.sort.join("\n") + "\n")
          '

          mapfile -t labels < <(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels[].name' | sort -u)
          if ((${#labels[@]} == 0)); then
            echo "LG-002 PASS: no labels yet; initial PR classification may be applied by automation"
            echo "LG-003 PASS: cardinality deferred until classification labels are applied"
            echo "LG-004 PASS: cardinality deferred until classification labels are applied"
            exit 0
          fi

          for label in "${labels[@]}"; do
            [[ -z "$label" ]] && continue
            grep -Fxq "$label" /tmp/catalog-labels || { echo "LG-002 FAIL: unauthorized label: $label"; exit 1; }
          done
          echo "LG-002 PASS: all PR labels are catalog-authorized"

          mapfile -t domains < <(ruby -ryaml -e 'c=YAML.safe_load(File.read("docs/Governance/Label-Catalog.yml"), permitted_classes: [], aliases: false); puts c["labels"]["domain"].keys')
          mapfile -t work_types < <(ruby -ryaml -e 'c=YAML.safe_load(File.read("docs/Governance/Label-Catalog.yml"), permitted_classes: [], aliases: false); puts c["labels"]["work_type"].keys')
          domain_count=0; work_count=0
          for label in "${labels[@]}"; do
            for d in "${domains[@]}"; do [[ "$label" == "$d" ]] && ((domain_count+=1)); done
            for w in "${work_types[@]}"; do [[ "$label" == "$w" ]] && ((work_count+=1)); done
          done
          [[ "$domain_count" -eq 1 ]] || { echo "LG-003 FAIL: expected exactly one domain label, got $domain_count"; exit 1; }
          [[ "$work_count" -eq 1 ]] || { echo "LG-004 FAIL: expected exactly one work_type label, got $work_count"; exit 1; }
          echo "LG-003 PASS: exactly one domain label"
          echo "LG-004 PASS: exactly one work_type label"

      - name: LG-005 Validate Issue/PR classification consistency
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number=$(grep -Eo '#[0-9]+' <<< "$PR_BODY" | head -n1 | tr -d '#' || true)
          if [[ -z "$issue_number" ]]; then
            echo "LG-005 FAIL: no Issue reference found in PR body"
            exit 1
          fi
          issue_body=$(gh issue view "$issue_number" --repo "$REPOSITORY" --json body --jq '.body')
          pr_meta=$(awk '/^```yaml[[:space:]]*$/{capture=1;next} capture && /^```[[:space:]]*$/{exit} capture{print}' <<< "$PR_BODY")
          issue_meta=$(awk '/^```yaml[[:space:]]*$/{capture=1;next} capture && /^```[[:space:]]*$/{exit} capture{print}' <<< "$issue_body")
          if [[ -z "$issue_meta" ]]; then
            echo "LG-005 PASS: Issue has no classification metadata; no consistency comparison required"
            exit 0
          fi
          PR_META="$pr_meta" ISSUE_META="$issue_meta" ruby -ryaml -e '
            pr=YAML.safe_load(ENV.fetch("PR_META"), permitted_classes: [], aliases: false) || {}
            issue=YAML.safe_load(ENV.fetch("ISSUE_META"), permitted_classes: [], aliases: false) || {}
            pc=pr.dig("governance","classification") || {}
            ic=issue.dig("governance","classification") || {}
            %w[domain work_type].each do |k|
              next if ic[k].nil?
              abort "LG-005 FAIL: #{k} mismatch (Issue=#{ic[k]} PR=#{pc[k]})" unless pc[k] == ic[k]
            end
            puts "LG-005 PASS: Issue/PR classification is consistent"
          '

      - name: LG-006 Protect taxonomy
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -Fxq 'docs/Governance/Label-Catalog.yml'; then
            git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- docs/Governance/Label-Catalog.yml > /tmp/catalog.diff
            if grep -E '^[+][[:space:]]{4,}[^ #][^:]*:' /tmp/catalog.diff | grep -Ev '^\+\+\+' >/dev/null; then
              echo "LG-006 FAIL: taxonomy entries cannot be added implicitly; catalog evolution requires explicit governance work"
              exit 1
            fi
          fi
          echo "LG-006 PASS: taxonomy protection active"
