name: Security — CodeQL Workflows

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'docs/Governance/13-Security-Validation-Architecture.md'
      - 'docs/Governance/Security/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'docs/Governance/13-Security-Validation-Architecture.md'
      - 'docs/Governance/Security/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql-actions:
    name: SAST GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
