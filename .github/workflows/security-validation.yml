name: Security Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to validate; leave empty for repository validation"
        required: false
        type: string
  repository_dispatch:
    types: [validation-requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  security-validation:
    name: Validate security controls
    runs-on: ubuntu-latest
    steps:
      - name: Resolve validation target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
          DISPATCH_PR: ${{ github.event.client_payload.pr_number }}
        run: |
          set -euo pipefail
          pr_number=""
          if [ "$EVENT_NAME" = "pull_request" ]; then pr_number="$EVENT_PR"; fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_PR" ]; then pr_number="$INPUT_PR"; fi
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ -n "$DISPATCH_PR" ]; then pr_number="$DISPATCH_PR"; fi
          if [ -n "$pr_number" ]; then
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
            echo "TARGET_PR_NUMBER=$pr_number" >> "$GITHUB_ENV"
            echo "TARGET_PR_SHA=$(printf '%s' "$pr_json" | jq -r '.head.sha')" >> "$GITHUB_ENV"
          else
            echo "TARGET_PR_NUMBER=" >> "$GITHUB_ENV"
            echo "TARGET_PR_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_PR_SHA }}

      - name: Repository security inventory
        run: |
          set -euo pipefail
          mkdir -p security-evidence
          find . -type f -not -path './.git/*' | sort > security-evidence/file-inventory.txt

          app_code_count=$(find . -type f \( -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.tsx' -o -name '*.jsx' -o -name '*.java' -o -name '*.kt' -o -name '*.go' -o -name '*.rs' -o -name '*.rb' -o -name '*.swift' -o -name '*.c' -o -name '*.cpp' -o -name '*.cs' \) -not -path './.git/*' -not -path './.github/*' | wc -l)
          manifest_count=$(find . -type f \( -name 'package.json' -o -name 'package-lock.json' -o -name 'npm-shrinkwrap.json' -o -name 'yarn.lock' -o -name 'pnpm-lock.yaml' -o -name 'requirements.txt' -o -name 'Pipfile' -o -name 'poetry.lock' -o -name 'pyproject.toml' -o -name 'go.mod' -o -name 'go.sum' -o -name 'Cargo.toml' -o -name 'Cargo.lock' -o -name 'pom.xml' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'Gemfile' -o -name 'Gemfile.lock' \) -not -path './.git/*' | wc -l)
          iac_count=$(find . -type f \( -name '*.tf' -o -name '*.tfvars' \) -not -path './.git/*' | wc -l)
          container_count=$(find . -type f \( -iname 'Dockerfile' -o -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \) -not -path './.git/*' | wc -l)

          {
            echo "commit=${GITHUB_SHA}"
            echo "app_code_files=$app_code_count"
            echo "dependency_manifests=$manifest_count"
            echo "iac_files=$iac_count"
            echo "container_files=$container_count"
            echo "workflow_files=$(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)"
          } | tee security-evidence/inventory-summary.txt

      - name: SV-001 Secret Material Scan
        run: |
          set -euo pipefail
          if git grep --cached -nE '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- ':!docs/Governance/13-Security-Validation-Architecture.md' ':!.github/workflows/security-validation.yml'; then
            echo "ERROR [SV-001]: Se detectó material de clave privada en archivos versionados."; exit 1
          fi
          if git grep --cached -nE '(gh[pousr]_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16})' -- ':!docs/Governance/13-Security-Validation-Architecture.md'; then
            echo "ERROR [SV-001]: Se detectó un patrón de credencial crítica conocido."; exit 1
          fi
          echo "SV-001=PASS" | tee -a security-evidence/control-results.txt

      - name: SV-002 Workflow Least Privilege
        run: |
          set -euo pipefail
          catalog=".github/security/workflow-permissions.yml"
          test -f "$catalog"
          workflow_count=$(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)
          [ "$workflow_count" -gt 0 ] || exit 1
          failed=0
          while IFS= read -r workflow; do
            if ! grep -Eq '^permissions:' "$workflow"; then failed=1; fi
            if grep -Eq '^permissions:[[:space:]]*(write-all|write)$' "$workflow"; then failed=1; fi
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          [ "$failed" -eq 0 ] || exit 1
          echo "SV-002=PASS" | tee -a security-evidence/control-results.txt

      - name: SV-003 Dangerous Workflow Trigger
        run: |
          set -euo pipefail
          if git grep -nE '^[[:space:]]*pull_request_target:' -- '.github/workflows'; then exit 1; fi
          echo "SV-003=PASS" | tee -a security-evidence/control-results.txt

      - name: SV-004 Security Workflow Integrity
        run: |
          set -euo pipefail
          workflow='.github/workflows/security-validation.yml'
          architecture='docs/Governance/13-Security-Validation-Architecture.md'
          test -f "$workflow"
          test -f "$architecture"
          for control in SV-001 SV-002 SV-003 SV-004; do grep -q "$control" "$workflow" || exit 1; done
          grep -q 'Validate security controls' "$architecture"
          echo "SV-004=PASS" | tee -a security-evidence/control-results.txt

      - name: Security applicability report
        run: |
          set -euo pipefail
          echo "SV-005=NOT_APPLICABLE" | tee -a security-evidence/control-results.txt
          echo "SV-006=NOT_APPLICABLE" | tee -a security-evidence/control-results.txt
          echo "SV-007=NOT_APPLICABLE" | tee -a security-evidence/control-results.txt
          echo "SV-008=NOT_APPLICABLE" | tee -a security-evidence/control-results.txt
          echo "SV-009=NOT_APPLICABLE" | tee -a security-evidence/control-results.txt
          echo "SV-001A=NOT_VERIFIED" | tee -a security-evidence/control-results.txt
          echo "SECURITY_VALIDATION=PASS" | tee -a security-evidence/control-results.txt
          echo "VALIDATION_EVENT=${{ github.event_name }}" | tee -a security-evidence/control-results.txt
          echo "TARGET_PR=${TARGET_PR_NUMBER:-NOT_APPLICABLE}" | tee -a security-evidence/control-results.txt
          echo "TARGET_SHA=${TARGET_PR_SHA}" | tee -a security-evidence/control-results.txt

      - name: Upload security evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-validation-${{ github.run_id }}
          path: security-evidence/
          retention-days: 90
