sot_resolution_analysis:
  verified_pairs:
    - pair:
        structured: "docs/Governance/Risk/Risk-Register.yml"
        human_readable: "docs/Governance/Risk/Risk-Register.md"
      resolution: "Risk-Register.yml is the structured SoT; Risk-Register.md is a derived human-readable projection."
      evidence:
        - "Risk-Register.md explicitly declares Risk-Register.yml as its structured source."
        - "The YAML contains the authoritative structured fields for RISK-001."
      action: "Future updates to risk records must originate in YAML; MD should be regenerated/updated as a derived view."
    - pair:
        structured: "docs/Governance/Decision/Decision-Authority-Matrix.yml"
        human_readable: "docs/Governance/Decision/Decision-Authority-Register.md"
      resolution: "Decision-Authority-Matrix.yml is the current canonical candidate for structured decision authority; the MD register is derived/readable representation."
      evidence:
        - "YAML defines ROLE-001..012 and DEC-001..012 with accountable, approval, blocking and consulted roles."
        - "The MD explicitly states that authority derives from the vigente authority register, not commit/PR authorship."
      caveat: "The repository should formalize the mirror rule in a future remediation change; #172 does not authorize editing the pair itself."
    - pair:
        policy: "docs/Governance/04-Quality-Gates.md"
        structured: "docs/Governance/Quality/Quality-Gate-Catalog.yml"
      resolution: "Semantic split, not a single-source conflict: 04-Quality-Gates.md remains the normative policy; Quality-Gate-Catalog.yml is the structured operational specification."
      evidence:
        - "The YAML declares 04-Quality-Gates.md as source."
        - "The MD states that each gate has an operational specification."
      caveat: "Synchronization/version coupling should be formalized before treating either representation as independently authoritative."
    - pair:
        policy: "docs/Governance/21-Engineering-Metrics-Governance.md"
        structured: "docs/Governance/Metrics/Metric-Catalog.yml"
      resolution: "Semantic split: 21 defines the metric governance model; Metric-Catalog.yml is the candidate SoT for individual metric definitions."
      evidence:
        - "21 defines the required metric schema and lifecycle states."
        - "Metric-Catalog.yml contains the structured EM-* definitions and evidence/limitation fields."
      caveat: "Operational measurement remains incomplete for several metrics; definition authority must not be confused with measurement effectiveness."
    - pair:
        policy: "docs/Governance/Configuration/Configuration-Item-Register.yml"
        human_readable: null
      resolution: "Configuration-Item-Register.yml explicitly declares itself as its own source_of_truth."
      evidence:
        - "source_of_truth field points to the same canonical path."
      caveat: "The register is proposed and contains proposed/active items; it is a configuration identity baseline, not proof that every configuration item is operationally baselined."
  structured_empty_registries:
    - "docs/Governance/AI/AI-Use-Inventory.yml"
    - "docs/Governance/AI/Model-Inventory.yml"
    - "docs/Governance/Supplier/Third-Party-Register.yml"
  finding: "Empty structured registries are valid controlled baselines/templates when explicitly marked initial or controlled-empty-baseline; emptiness must not be interpreted as evidence that no real-world usage/provider/model exists unless the scope of the registry is verified."

