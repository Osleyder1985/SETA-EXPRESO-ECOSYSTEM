historical_policy:
  "ISO/IEC/IEEE 12207:2017": "historical-replaced; never a current normative source."
anti_drift:
  - "Every normative consumer must reference the registry identity and edition or explicitly inherit from a canonical matrix."
  - "Derived mirrors cannot introduce a different edition."
  - "A version change requires impact analysis and synchronized consumer updates."
  - "Validation must detect conflicting editions where automation supports it."
evidence_boundary: "Registry status is documentary governance evidence and does not establish conformity, certification or operational effectiveness."
