schema_version: "1"
registry_id: "NORMATIVE-STANDARD-REGISTRY"
status: "controlled-first-layer"
source_of_truth: true
purpose: "Persistent control of normative standard identity, edition, status, authority, project adoption and update rules."
rule: "A published standard is not replaced by a draft, DIS, CD or project under development. Changes require controlled impact analysis and Issue→Branch→Commit→Validation→Review→PR→Merge."
fields:
  required: [standard_id, edition, status, authority, project_use, normative_function, update_rule]
  statuses: [current, current-with-successor-under-development, historical-replaced, pending-external-verification, draft-not-adopted]
